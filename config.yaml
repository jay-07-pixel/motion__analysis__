# =============================================================================
# Project: 2D and 3D Motion Analysis (single Intel RealSense D455f)
# File:     config.yaml
# Phase:    Step 1 — live RGB capture only
#
# WHY THIS FILE EXISTS
# --------------------
# Sir asked for no hardcoding. Resolution, FPS, window name, and keys must
# live here — not buried inside Python. Change a value here, run again.
# You should not need to edit source code for camera settings.
#
# WHAT STEP 1 USES
# ----------------
# Only the "camera" and "display" sections below. Pose, analysis, and save
# paths will be added in later steps, still in this same file.
# =============================================================================

# Human-readable project identity (shown in window title / later reports).
project:
  title: "2D and 3D Motion Analysis"
  student: "Jay"
  camera_model: "Intel RealSense D455f"
  # Current build phase. Keep this as 2d until we start depth -> 3D.
  phase: "2d"

# Live RealSense RGB stream. These must match what the D455f actually supports.
# Common working modes: 1280x720 @ 30fps, 640x480 @ 30fps.
# If start() fails, try width/height 640 and 480 first.
camera:
  # Colour width and height in pixels. These are camera image coordinates:
  # u goes 0 .. width-1 (left -> right), v goes 0 .. height-1 (top -> bottom).
  width: 1280
  height: 720
  # Frames per second requested from the colour sensor.
  fps: 30
  # OpenCV uses BGR. RealSense can deliver colour already in bgr8 so we do
  # not convert RGB->BGR every frame.
  color_format: "bgr8"

# On-screen window for Step 1 (Viewer-like preview, but our own Python).
display:
  window_title: "Step 1 - Live RGB (D455f)"
  # Keyboard key that stops the loop. Must be a single character.
  quit_key: "q"
