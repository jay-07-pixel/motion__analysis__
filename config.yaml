# =============================================================================
# Project: 2D and 3D Motion Analysis (single Intel RealSense D455f)
# File:     config.yaml
#
# WHY THIS FILE EXISTS
# --------------------
# Sir asked for no hardcoding. Resolution, FPS, file path, and keys live
# here — not buried inside Python. Change a value here, run again.
#
# STEP 1 uses: camera, display
# STEP 2 uses: source, display, camera.fps (fallback if a movie has no FPS)
# STEP 3 uses: source, pose, overlay, display
# STEP 4 uses: source, pose, overlay, display, output
# STEP 5 uses: source, pose, overlay, display, output, analysis
# STEP 6 GUI uses: all of the above (live vs upload is chosen in the window)
# =============================================================================

# Human-readable project identity (shown in window title / later reports).
project:
  title: "2D and 3D Motion Analysis"
  student: "Jay"
  camera_model: "Intel RealSense D455f"
  # Current GUI default. The 2D / 3D buttons override this at Start.
  phase: "2d"

# Which pictures to read. Step 3 pose uses this same switch.
source:
  # "live" = USB D455f (best for seeing a skeleton on yourself)
  # "file" = uploaded clip — path below (needs a person in the video)
  mode: "live"
  # Relative paths start at the project folder. Examples:
  #   data/input/clip.mp4     colour movie (2D only, no depth)
  #   data/input/clip.avi
  #   data/input/session.bag  RealSense recording (RGB now, depth later)
  file_path: "data/input/sample.mp4"
  # If true, replay from the start when the file ends.
  loop: false

# Live RealSense RGB stream. Also used if a movie file does not report FPS.
# Common working modes: 1280x720 @ 30fps, 640x480 @ 30fps.
camera:
  # Colour width and height in pixels. These are camera image coordinates:
  # u goes 0 .. width-1 (left -> right), v goes 0 .. height-1 (top -> bottom).
  width: 1280
  height: 720
  # Frames per second requested from the colour sensor (live), and playback
  # fallback for mp4/avi if the file does not store FPS.
  fps: 30
  # OpenCV uses BGR. RealSense can deliver colour already in bgr8 so we do
  # not convert RGB->BGR every frame on live USB.
  color_format: "bgr8"
  # Depth stream used only when the GUI 3D button is on. Aligned to colour.
  # D455f useful range is about 0.4 m .. 6 m.
  depth:
    width: 1280
    height: 720
    fps: 30
    min_m: 0.3
    max_m: 6.0
    # Median of this many pixels around the joint (odd number).
    sample_window: 5
    # Calm a still joint. 1 = raw depth (jumpy), 0.35 = blend with the last point.
    smooth: 0.35
    # Moves smaller than this (metres) stay put. 0.008 m = 0.8 cm.
    deadband_m: 0.008
    # If depth blinks off, keep the last camera point for this many frames.
    hold_frames: 5

# MediaPipe Pose (Step 3). All thresholds live here — not in Python.
pose:
  # 0 = fastest, 1 = default, 2 = slowest / most accurate.
  model_complexity: 1
  # First-time person detection (0..1).
  min_detection_confidence: 0.5
  # Keep tracking the same person (0..1).
  min_tracking_confidence: 0.5
  # Do not draw a joint if MediaPipe visibility is below this.
  min_visibility: 0.5
  # MediaPipe Hands: 21 joints per hand (knuckles + every fingertip).
  # Pose only has wrist / thumb tip / index tip / pinky tip.
  hands:
    enabled: true
    max_num_hands: 2
    model_complexity: 1
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    # Hands Left/Right assumes a selfie (mirrored) image. D455f is not
    # mirrored, so the label would put the left hand on the right arm.
    swap_handedness: true
    # Attach each hand to the nearest Pose wrist (same arm as the elbow).
    match_to_pose_wrists: true

# Stick-figure overlay (Step 3). Colours are OpenCV BGR: [Blue, Green, Red].
overlay:
  point_radius: 5
  line_thickness: 2
  point_color_bgr: [0, 255, 0]
  line_color_bgr: [0, 200, 255]

# Where Step 4 writes files. Each run gets its own timestamped subfolder.
output:
  folder: "data/output"
  stamp_format: "%Y%m%d-%H%M%S"
  save_csv: true
  csv_name: "keypoints_2d.csv"
  save_overlay_video: true
  video_name: "overlay.mp4"
  video_codec: "mp4v"
  save_run_json: true
  angles_csv_name: "angles_2d.csv"

# Step 5/6: joint angles. 2D is the photo; 3D is the body frame.
# Face the camera. Joint names must match MediaPipe (see src/pose/skeleton.py).
analysis:
  # GUI 2D / 3D buttons override this at Start.
  # 2d = colour pixels (u, v). 3d = camera metres (X, Y, Z) from depth.
  space: 2d
  # Overlay text in 3D mode. CSV always stores metres (x_m, y_m, z_m).
  coord_3d_display: cm
  # Skip an angle if any of its three joints is below this.
  min_confidence: 0.5
  # Signed DOFs beside the one-angle dials. 3D only. Thresholds are degrees.
  # plane_singular_deg: hide plane of elevation this close to hanging or overhead.
  # 25, not 15: on recording 20261005-144120 the arms-down hold sat near -12 to -24
  # degrees. A 15 degree gate still published planes that swung from about -68 to +76.
  # 25 marks that hang singular and still keeps the first forward frames (plane near +70).
  # elbow_sign_deadband_deg: call the elbow straight when the bend is smaller.
  dof:
    enabled: true
    plane_singular_deg: 25
    elbow_sign_deadband_deg: 5
  # Local axes drawn in 3D only. Length is metres. Colours are BGR.
  joint_frame_axis_m: 0.12
  joint_frame_colors_bgr:
    u: [0, 220, 255]
    v: [80, 255, 120]
    w: [255, 80, 255]
  # One frame per dial. reference = axis u, measure = the bone we read.
  # The angle uses all three axes. plane_hints lock v and w to the body
  # (first hint that is not parallel to u). They are not a second angle.
  # Shoulder `across` squares the hip line to the shoulder line.
  joint_frames:
    - name: left_shoulder
      origin: left_shoulder
      reference: [left_shoulder, left_hip]
      measure: [left_shoulder, left_elbow]
      across: [left_shoulder, right_shoulder]
    - name: right_shoulder
      origin: right_shoulder
      reference: [right_shoulder, right_hip]
      measure: [right_shoulder, right_elbow]
      across: [left_shoulder, right_shoulder]
    - name: left_elbow
      origin: left_elbow
      reference: [left_elbow, left_shoulder]
      measure: [left_elbow, left_wrist]
      plane_hints:
        - [left_shoulder, left_hip]
        - [left_shoulder, right_shoulder]
    - name: right_elbow
      origin: right_elbow
      reference: [right_elbow, right_shoulder]
      measure: [right_elbow, right_wrist]
      plane_hints:
        - [right_shoulder, right_hip]
        - [left_shoulder, right_shoulder]
    - name: left_wrist
      origin: left_wrist
      reference: [left_wrist, left_elbow]
      measure: [left_wrist, left_index]
      plane_hints:
        - [left_elbow, left_shoulder]
        - [left_shoulder, right_shoulder]
    - name: right_wrist
      origin: right_wrist
      reference: [right_wrist, right_elbow]
      measure: [right_wrist, right_index]
      plane_hints:
        - [right_elbow, right_shoulder]
        - [left_shoulder, right_shoulder]
  # Each item: angle at points[1], using points[0] and points[2].
  # In 3D, joint_frames overrides the matching name. This list is the
  # 2D photo angle, and the 3D fallback when a frame has no depth.
  angles:
    - name: left_shoulder
      points: [left_hip, left_shoulder, left_elbow]
    - name: left_elbow
      points: [left_shoulder, left_elbow, left_wrist]
    - name: left_wrist
      points: [left_elbow, left_wrist, left_index]
    - name: right_shoulder
      points: [right_hip, right_shoulder, right_elbow]
    - name: right_elbow
      points: [right_shoulder, right_elbow, right_wrist]
    - name: right_wrist
      points: [right_elbow, right_wrist, right_index]
  angle_text_bgr: [0, 255, 255]
  # Speeds for a take such as the Box and Block test.
  # Angular: how fast the dial angle changes (degrees per second).
  # Linear: how fast the wrist moves in camera metres (metres per second).
  # Linear is only available in 3D. A step inside the deadband counts as still.
  velocity:
    linear_joints: [left_wrist, right_wrist]
    smooth: 0.45
    deadband_deg: 1.5
    deadband_m: 0.004
    max_gap_sec: 0.4
    angular_mode_bin: 10
    linear_mode_bin: 0.05
  # Draw (u, v) camera-pixel labels on these joints. Colours are BGR.
  highlight_joints:
    - name: left_wrist
      label: "L wrist"
      color_bgr: [80, 224, 200]
    - name: right_wrist
      label: "R wrist"
      color_bgr: [255, 166, 76]
    - name: nose
      label: "Nose"
      color_bgr: [0, 220, 255]
  # Live analog dials: joint angles in degrees.
  gauge_joints:
    left: [left_shoulder, left_elbow, left_wrist]
    right: [right_shoulder, right_elbow, right_wrist]
  # Needle full-scale. 180° ≈ straight.
  angle_gauge_max_deg: 180
  # Which scale is selected at startup. Buttons offer every step below.
  angle_gauge_step_deg: 45
  angle_gauge_steps: [45, 20]
  # After Stop, mode is the most common 10° bin.
  angle_mode_bin_deg: 10
  # Extra Hands joints (knuckles / mid-finger). Tips already exist in Pose
  # as left_thumb, left_index, left_pinky (and right_*). Regions that set
  # include_hand_landmarks: true add these to the skeleton draw list.
  hand_landmarks:
    [
      left_thumb_cmc, left_thumb_mcp, left_thumb_ip,
      left_index_mcp, left_index_pip, left_index_dip,
      left_middle_mcp, left_middle_pip, left_middle_dip, left_middle_tip,
      left_ring_mcp, left_ring_pip, left_ring_dip, left_ring_tip,
      left_pinky_mcp, left_pinky_pip, left_pinky_dip,
      right_thumb_cmc, right_thumb_mcp, right_thumb_ip,
      right_index_mcp, right_index_pip, right_index_dip,
      right_middle_mcp, right_middle_pip, right_middle_dip, right_middle_tip,
      right_ring_mcp, right_ring_pip, right_ring_dip, right_ring_tip,
      right_pinky_mcp, right_pinky_pip, right_pinky_dip,
    ]
  # GUI region picker. Keys must match analysis.regions below.
  region: full_body
  regions:
    full_body:
      label: "Full body"
      joints: []
      angles: [left_shoulder, left_elbow, left_wrist, right_shoulder, right_elbow, right_wrist]
      gauges:
        left: [left_shoulder, left_elbow, left_wrist]
        right: [right_shoulder, right_elbow, right_wrist]
      highlight: [left_wrist, right_wrist]
    upper_body:
      label: "Upper body"
      include_hand_landmarks: true
      joints:
        [
          nose, left_eye, right_eye, left_ear, right_ear, mouth_left, mouth_right,
          left_shoulder, right_shoulder, left_elbow, right_elbow,
          left_wrist, right_wrist, left_pinky, right_pinky, left_index, right_index,
          left_thumb, right_thumb, left_hip, right_hip,
        ]
      angles: [left_shoulder, left_elbow, left_wrist, right_shoulder, right_elbow, right_wrist]
      gauges:
        left: [left_shoulder, left_elbow, left_wrist]
        right: [right_shoulder, right_elbow, right_wrist]
      highlight: [left_wrist, right_wrist]
    both_arms:
      label: "Both arms"
      include_hand_landmarks: true
      joints:
        [
          left_shoulder, right_shoulder, left_elbow, right_elbow,
          left_wrist, right_wrist, left_pinky, right_pinky, left_index, right_index,
          left_thumb, right_thumb,
        ]
      angles: [left_shoulder, left_elbow, left_wrist, right_shoulder, right_elbow, right_wrist]
      gauges:
        left: [left_shoulder, left_elbow, left_wrist]
        right: [right_shoulder, right_elbow, right_wrist]
      highlight: [left_wrist, right_wrist]
    both_hands:
      label: "Both hands"
      include_hand_landmarks: true
      joints:
        [
          left_wrist, right_wrist, left_pinky, right_pinky, left_index, right_index,
          left_thumb, right_thumb,
        ]
      angles: [left_wrist, right_wrist]
      gauges:
        left: [left_wrist]
        right: [right_wrist]
      highlight: [left_wrist, right_wrist]
      bones:
        - [left_wrist, left_thumb]
        - [left_wrist, left_pinky]
        - [right_wrist, right_thumb]
        - [right_wrist, right_pinky]
    face:
      label: "Face"
      joints:
        [
          nose, left_eye_inner, left_eye, left_eye_outer,
          right_eye_inner, right_eye, right_eye_outer,
          left_ear, right_ear, mouth_left, mouth_right,
        ]
      angles: []
      gauges:
        left: []
        right: []
      highlight: [nose]
      bones:
        - [nose, left_eye]
        - [nose, right_eye]
        - [left_eye, left_ear]
        - [right_eye, right_ear]
        - [mouth_left, mouth_right]
        - [nose, mouth_left]
        - [nose, mouth_right]

# On-screen window. Title can change per step; quit key stays one character.
display:
  window_title: "2D Motion Analysis"
  quit_key: "q"
